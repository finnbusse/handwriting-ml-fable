name: Versuchsreihe (mehrere Trainingsvarianten nebeneinander)

# Läuft nur von Hand. Trainiert jede Variante aus der Liste auf einem eigenen kostenlosen Rechner,
# misst sie mit scripts/evaluate.py und legt Modell, Messwerte und Beispielblätter im Modell-Repo
# unter experiments/<name>/ ab. Das veröffentlichte Modell bleibt unberührt.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'JSON-Liste: [{"name": "e12", "args": "--lines-only --epochs 12"}, ...]'
        required: true
        type: string

jobs:
  variant:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(inputs.runs) }}
    name: ${{ matrix.run.name }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Abhängigkeiten installieren
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Trainieren, messen, ablegen
        run: python scripts/experiment.py "${{ matrix.run.name }}" --upload -- ${{ matrix.run.args }}
