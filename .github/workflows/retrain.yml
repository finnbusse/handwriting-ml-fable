name: Übersicht aktualisieren und neu trainieren

# Läuft nur, wenn es von Hand gestartet wird (Actions > dieser Eintrag > Run workflow).
# 1. ergänzt fehlende Vorschaubilder für den Dataset Viewer (normalerweise legt die App sie selbst an),
# 2. trainiert das Modell neu, wenn mindestens 20 neue Zeilen dazugekommen sind
#    (oder "force" angehakt ist), und legt es im Modell-Repo ab.
# Braucht das Repository-Secret HF_TOKEN (Hugging-Face-Token mit Schreibrecht).
# Der Fortschritt steht wie bei jedem Lauf unter training/ im Modell-Repo und ist im
# Tab "Training" der App zu sehen; "Abbrechen" dort beendet auch diesen Lauf nach der Runde.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Auch mit weniger als 20 neuen Zeilen trainieren
        type: boolean
        default: false

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Abhängigkeiten installieren
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Fehlende Vorschaubilder im Dataset ergänzen
        run: python scripts/rebuild_preview.py
      - name: Gibt es genug neue Aufnahmen?
        id: check
        run: python scripts/retrain.py check ${{ inputs.force && '--force' || '' }}
      - name: Trainieren, vergleichen, veröffentlichen
        if: steps.check.outputs.needed == 'true'
        run: python scripts/retrain.py run
      - name: Vergleichsbild sichern
        if: steps.check.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vergleich
          path: runs/retrain/vergleich.png
          retention-days: 14
